# ══════════════════════════════════════════════════════════════════════════════
#  NOVATRIX DIGITAL — Cloudflare Pages
# ══════════════════════════════════════════════════════════════════════════════
#
#  Deploy:
#    npm run build
#    npx wrangler pages deploy dist --project-name novatrix-digital
#
#  Or connect the Git repo in the Cloudflare dashboard with:
#    Build command      : npm run build
#    Build output       : dist
#    Node version       : 20 (or newer)
#
#  Because public/_worker.js is copied into dist, Pages runs in ADVANCED MODE:
#  that worker handles every request (SPA routing, caching, security headers)
#  and the _redirects / _headers files are ignored. Delete public/_worker.js to
#  fall back to the simple static handler driven by public/_redirects.

name = "novatrix-digital"

# Production hostname: https://finance.novatrixdigital.in
# Custom domains are attached in the dashboard, not from this file:
#   Workers & Pages → novatrix-digital → Custom domains → Set up a custom domain
#   → finance.novatrixdigital.in
# Cloudflare creates the CNAME automatically when novatrixdigital.in is on
# Cloudflare DNS. If DNS lives elsewhere, add:
#   CNAME  finance  novatrix-digital.pages.dev
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# ── Environment variables ─────────────────────────────────────────────────────
#
#  Set these in the Cloudflare dashboard under
#  Workers & Pages → novatrix-digital → Settings → Variables and Secrets,
#  for BOTH Production and Preview. Vite inlines VITE_* at build time, so they
#  must exist before the build step runs.
#
#    VITE_SUPABASE_URL       https://<project-ref>.supabase.co
#    VITE_SUPABASE_ANON_KEY  <anon / publishable key>
#
#  NEVER add these here — a Pages build environment feeds the client bundle:
#    SUPABASE_SERVICE_ROLE_KEY  bypasses Row Level Security entirely
#    RESEND_API_KEY             can send mail as your verified domain
#    REMINDER_SECRET            authorises the reminder function
#
#  Those three belong to the Supabase Edge Function. Upload them with
#  `npm run secrets:push`, or set them in the Supabase dashboard under
#  Project Settings -> Edge Functions -> Secrets.

[vars]
VITE_APP_URL = "https://finance.novatrixdigital.in"
VITE_APP_NAME = "Novatrix Digital"
VITE_DEFAULT_CURRENCY = "INR"

# The two Supabase values are intentionally NOT committed. Uncomment locally
# only if you are deploying a throwaway preview project.
# VITE_SUPABASE_URL = ""
# VITE_SUPABASE_ANON_KEY = ""
