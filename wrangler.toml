# ══════════════════════════════════════════════════════════════════════════════
#  NOVATRIX DIGITAL — Cloudflare Workers (static assets)
#  Production: https://finance.novatrixdigital.in
# ══════════════════════════════════════════════════════════════════════════════
#
#  The connected build runs:
#      Executing user build command:  npm run build
#      Executing user deploy command: npx wrangler deploy
#
#  `wrangler deploy` OVERWRITES the Worker's remote configuration with whatever
#  is in this file. Anything configured in the dashboard but missing here gets
#  removed — which is why the custom domain route is declared below rather than
#  left implicit.
# ══════════════════════════════════════════════════════════════════════════════

# Must match the Worker the CI deploys to, or wrangler warns and overrides it.
name = "finance"

# Kept in step with the remote Worker to avoid config drift on every deploy.
compatibility_date = "2026-09-08"
compatibility_flags = ["nodejs_compat"]

# The Worker runs in front of the assets so runtime secrets have somewhere to
# be read: /healthz, POST /api/reminders/run, the cron job, and SPA fallback.
main = "worker/index.js"

# ── Custom domain ─────────────────────────────────────────────────────────────
#
#  Declared here because a deploy replaces the remote route list. Without it,
#  each deploy would silently detach finance.novatrixdigital.in from the Worker.
routes = [
  { pattern = "finance.novatrixdigital.in", zone_name = "novatrixdigital.in", custom_domain = true }
]

# ── Static assets ─────────────────────────────────────────────────────────────
[assets]
directory = "./dist"

# Exposes the bundle to worker/index.js as env.ASSETS.
binding = "ASSETS"

# "none" because the Worker does the SPA fallback itself — it needs to see
# unmatched paths in order to route /api/* and /healthz.
#
# Note: do NOT ship a `_redirects` file containing `/* /index.html 200`.
# Workers rejects it as a self-triggering rule:
#   "Line 2: Infinite loop detected in this rule" [code: 100324]
not_found_handling = "none"

# ── Cron: send due reminders every morning ────────────────────────────────────
# 01:00 UTC = 06:30 IST. Calls scheduled() in worker/index.js.
[triggers]
crons = ["0 1 * * *"]

# ══════════════════════════════════════════════════════════════════════════════
#  BUILD VARIABLES — set in the dashboard, not in this file
# ══════════════════════════════════════════════════════════════════════════════
#
#  There is deliberately no [vars] block. Build and runtime are separate
#  layers, and VITE_* belongs to the build one:
#
#    BUILD   Vite inlines VITE_* into the bundle while `vite build` runs.
#            A [vars] entry is a RUNTIME binding, which is far too late.
#            Set these under Settings → Build → Variables and secrets:
#
#              VITE_SUPABASE_URL        https://<project-ref>.supabase.co
#              VITE_SUPABASE_ANON_KEY   <anon / publishable key>
#              VITE_APP_URL             https://finance.novatrixdigital.in
#              VITE_APP_NAME            Novatrix Digital
#              VITE_DEFAULT_CURRENCY    INR
#
#    RUNTIME worker/index.js reads its secrets from the bindings listed at the
#            bottom of this file. Those never reach the browser.
#
#  A [vars] block here would also clobber the dashboard. An earlier deploy
#  warned: "VITE_APP_URL and VITE_DEFAULT_CURRENCY conflict with existing
#  remote secrets ... will replace them."
#
#  scripts/gen-headers.mjs prints a warning in the build log if
#  VITE_SUPABASE_URL is missing, so a misconfigured build is visible.
#
#  NEVER put these in the BUILD environment — a build feeds the bundle:
#     SUPABASE_SERVICE_ROLE_KEY · RESEND_API_KEY · REMINDER_SECRET
#  They belong to the runtime bindings below.

# ══════════════════════════════════════════════════════════════════════════════
#  RUNTIME SECRETS — set in the dashboard, never in this file
# ══════════════════════════════════════════════════════════════════════════════
#
#  Settings → Variables and Secrets → add as type "Secret":
#
#      SUPABASE_URL                https://<ref>.supabase.co
#      SUPABASE_SERVICE_ROLE_KEY   bypasses RLS — server side only
#      RESEND_API_KEY              re_…
#      RESEND_FROM                 Novatrix Digital <reminders@novatrixdigital.in>
#      APP_URL                     https://finance.novatrixdigital.in
#      REMINDER_SECRET             long random string
#
#  These are safe here in a way they never are as BUILD variables: the Worker
#  runs on Cloudflare's servers, so nothing it reads reaches the browser.
#
#  Locally: copy .dev.vars.example to .dev.vars, then `npm run cf:dev`.
#  Check what is bound at any time: GET /healthz reports presence, not values.
